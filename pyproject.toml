[project]
name = "clean-code-skill-evals"
version = "2.0.0"
requires-python = ">=3.10"

[tool.pyright]
extraPaths = ["evals"]
# The agentic fixtures are separate projects with deliberate smells for the agent to leave alone.
exclude = ["evals/cases-agentic", "evals/.cache", "**/node_modules", "**/__pycache__", "**/.*"]

[tool.ruff]
line-length = 110
extend-exclude = ["evals/cases-agentic"]

[tool.ruff.format]
exclude = ["*.md"]
