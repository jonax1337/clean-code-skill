<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="title desc">
  <title id="title">How the skill works on a task</title>
  <desc id="desc">Six steps: read the surrounding code and find existing helpers; make the smallest change that solves the task; test first, or pin untested code before changing it; refactor in small steps while the tests stay green; check the final checklist against the own diff; report the commands run and their real results. Where a rule was bent, say why in one line.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; }
    .bg { fill: #f6f8f7; } .frame { stroke: #e2e8e5; }
    .ink { fill: #0b1215; } .ink2 { fill: #47554f; } .muted { fill: #6f7d77; }
    .accent { fill: #08805f; } .on-accent { fill: #ffffff; }
    .track { stroke: #08805f; } .branch { stroke: #9aa7a1; }
    .node { fill: #e3f5ed; stroke: #08805f; } .node-text { fill: #08805f; }
    .pill { fill: #ffffff; stroke: #cfd7d3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1614; } .frame { stroke: #1f2a26; }
      .ink { fill: #edf3f0; } .ink2 { fill: #b4c1bb; } .muted { fill: #83918b; }
      .accent { fill: #34d399; } .on-accent { fill: #04140e; }
      .track { stroke: #34d399; } .branch { stroke: #4b5853; }
      .node { fill: #15302a; stroke: #34d399; } .node-text { fill: #34d399; }
      .pill { fill: #141d1a; stroke: #2c3834; }
    }
  </style>

  <rect class="bg frame" x="0.5" y="0.5" width="879" height="269" rx="12" stroke-width="1"/>
  <text class="ink" x="32" y="42" font-size="18" font-weight="700">How the skill works on a task</text>
  <text class="ink2" x="32" y="62" font-size="12.5">From reading the code to a report that claims only what was checked</text>
  <circle class="accent" cx="773" cy="34" r="3.5"/>
  <text class="muted mono" x="848" y="38" font-size="11" text-anchor="end">clean-code</text>

  <line class="track" x1="90" y1="112" x2="790" y2="112" stroke-width="2" stroke-opacity="0.35"/>

  <g text-anchor="middle">
    <circle class="node" cx="90" cy="112" r="19" stroke-width="1.5"/>
    <text class="node-text mono" x="90" y="117" font-size="13" font-weight="700">1</text>
    <text class="ink" x="90" y="158" font-size="14" font-weight="700">Read</text>
    <text class="ink2" x="90" y="178" font-size="12">the surrounding code,</text>
    <text class="ink2" x="90" y="194" font-size="12">find existing helpers</text>

    <circle class="node" cx="230" cy="112" r="19" stroke-width="1.5"/>
    <text class="node-text mono" x="230" y="117" font-size="13" font-weight="700">2</text>
    <text class="ink" x="230" y="158" font-size="14" font-weight="700">Smallest change</text>
    <text class="ink2" x="230" y="178" font-size="12">that solves the task,</text>
    <text class="ink2" x="230" y="194" font-size="12">nothing speculative</text>

    <circle class="node" cx="370" cy="112" r="19" stroke-width="1.5"/>
    <text class="node-text mono" x="370" y="117" font-size="13" font-weight="700">3</text>
    <text class="ink" x="370" y="158" font-size="14" font-weight="700">Test first</text>
    <text class="ink2" x="370" y="178" font-size="12">or pin untested code</text>
    <text class="ink2" x="370" y="194" font-size="12">before changing it</text>

    <circle class="node" cx="510" cy="112" r="19" stroke-width="1.5"/>
    <text class="node-text mono" x="510" y="117" font-size="13" font-weight="700">4</text>
    <text class="ink" x="510" y="158" font-size="14" font-weight="700">Refactor</text>
    <text class="ink2" x="510" y="178" font-size="12">in small steps,</text>
    <text class="ink2" x="510" y="194" font-size="12">tests stay green</text>

    <circle class="node" cx="650" cy="112" r="19" stroke-width="1.5"/>
    <text class="node-text mono" x="650" y="117" font-size="13" font-weight="700">5</text>
    <text class="ink" x="650" y="158" font-size="14" font-weight="700">Check the diff</text>
    <text class="ink2" x="650" y="178" font-size="12">final checklist</text>
    <text class="ink2" x="650" y="194" font-size="12">against its own diff</text>

    <circle class="accent" cx="790" cy="112" r="21"/>
    <path class="on-accent" d="M780.5 111.5 l2.6 -2.6 l4.4 4.4 l9.4 -9.4 l2.6 2.6 l-12 12 Z"/>
    <text class="ink" x="790" y="158" font-size="14" font-weight="700">Report</text>
    <text class="ink2" x="790" y="178" font-size="12">commands run,</text>
    <text class="ink2" x="790" y="194" font-size="12">real results</text>
  </g>

  <path class="branch" d="M650 202 V226 H600" fill="none" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect class="pill" x="352" y="212" width="248" height="28" rx="14" stroke-width="1"/>
  <text class="ink2 mono" x="476" y="230" font-size="12" text-anchor="middle">bent a rule? say why in one line</text>
</svg>
