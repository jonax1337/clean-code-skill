<svg xmlns="http://www.w3.org/2000/svg" width="880" height="352" viewBox="0 0 880 352" role="img" aria-labelledby="title desc">
  <title id="title">Precedence of rules</title>
  <desc id="desc">When rules conflict, the higher layer wins: 1 correct and verified, 2 the codebase and the language, 3 Beck's four rules of simple design, 4 the heuristics C1 to T9.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .bg { fill: #eceff8; } .frame { stroke: #ccd6ea; }
    .ink { fill: #172740; } .ink2 { fill: #435573; } .muted { fill: #566985; } .accent { fill: #284fba; }
    .arrow { stroke: #adbbd5; } .arrowhead { fill: #adbbd5; }
    .l1 { fill: #284fba; } .l2 { fill: #4b6fc8; } .l3 { fill: #a0b9eb; } .l4 { fill: #c3d2f5; }
    .on-l1, .on-l2 { fill: #ffffff; } .on-l3, .on-l4 { fill: #172740; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #172740; } .frame { stroke: #2c4260; }
      .ink { fill: #f3f6fc; } .ink2 { fill: #cbd5e7; } .muted { fill: #aabad5; } .accent { fill: #8fabff; }
      .arrow { stroke: #4b6386; } .arrowhead { fill: #4b6386; }
      .l1 { fill: #b4c9ff; } .l2 { fill: #8fabff; } .l3 { fill: #385a95; } .l4 { fill: #2b4674; }
      .on-l1, .on-l2 { fill: #172740; } .on-l3, .on-l4 { fill: #f3f6fc; }
    }
  </style>

  <rect class="bg frame" x="0.5" y="0.5" width="879" height="351" rx="12" stroke-width="1"/>
  <text class="ink" x="32" y="42" font-size="18" font-weight="700">When rules conflict, the higher one wins</text>
  <rect class="accent" x="724" y="30" width="7" height="7"/>
  <text class="muted mono" x="848" y="38" font-size="11" text-anchor="end">Clean Code Skill</text>

  <line class="arrow" x1="44" y1="300" x2="44" y2="84" stroke-width="2" stroke-linecap="round"/>
  <path class="arrowhead" d="M44 74 L50 86 L38 86 Z"/>
  <text class="muted mono" font-size="11" letter-spacing="1" transform="translate(36 260) rotate(-90)">TAKES PRECEDENCE</text>

  <g font-size="15">
    <rect class="l1" x="64" y="70" width="380" height="54" rx="8"/>
    <text class="on-l1 mono" x="84" y="102" font-size="13" font-weight="700" opacity="0.75">01</text>
    <text class="on-l1" x="116" y="102" font-weight="700">Correct and verified</text>
    <text class="ink2" x="472" y="93">Tests, type checks and linters pass.</text>
    <text class="ink2" x="472" y="113">Unintended behavior did not change.</text>

    <rect class="l2" x="64" y="132" width="380" height="54" rx="8"/>
    <text class="on-l2 mono" x="84" y="164" font-size="13" font-weight="700" opacity="0.75">02</text>
    <text class="on-l2" x="116" y="164" font-weight="700">The codebase and the language</text>
    <text class="ink2" x="472" y="155">Project conventions, then language idioms.</text>
    <text class="ink2" x="472" y="175">Go errors, Kotlin nulls, C# I-prefixes stay.</text>

    <rect class="l3" x="64" y="194" width="380" height="54" rx="8"/>
    <text class="on-l3 mono" x="84" y="226" font-size="13" font-weight="700" opacity="0.75">03</text>
    <text class="on-l3" x="116" y="226" font-weight="700">Beck's four rules of simple design</text>
    <text class="ink2" x="472" y="217">Passes tests, no duplication,</text>
    <text class="ink2" x="472" y="237">expresses intent, fewest elements.</text>

    <rect class="l4" x="64" y="256" width="380" height="54" rx="8"/>
    <text class="on-l4 mono" x="84" y="288" font-size="13" font-weight="700" opacity="0.75">04</text>
    <text class="on-l4" x="116" y="288" font-weight="700">Heuristics C1–T9</text>
    <text class="ink2" x="472" y="279">The smell catalog from chapter 17,</text>
    <text class="ink2" x="472" y="299">named in plain words in reviews.</text>
  </g>

  <text class="muted" x="64" y="334" font-size="12.5">Bend a rule only with a one-line reason: hot paths, generated code, spikes, legacy consistency.</text>
</svg>
