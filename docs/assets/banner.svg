<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">clean-code</title>
  <desc id="desc">Clean Code after Robert C. Martin, rebuilt for coding agents. An agent report lists what the skill makes the agent do: keep the scope to the task, reuse existing helpers, add a test that fails on the old code, run the tests after the last edit, and claim only what was checked.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="glow-right" cx="0.78" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-left" cx="0.08" cy="1" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2e27"/>
      <stop offset="1" stop-color="#0b1411"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#0a110f"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#glow-right)"/>
    <rect width="1280" height="400" fill="url(#glow-left)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- mark -->
  <g transform="translate(72 78) scale(0.164)">
    <rect width="512" height="512" rx="116" fill="url(#tile)"/>
    <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M204 146 C168 146 160 164 160 196 L160 226 C160 245 150 256 130 256 C150 256 160 267 160 286 L160 316 C160 348 168 366 204 366" stroke="#e8f1ed" stroke-width="30"/>
      <path d="M308 146 C344 146 352 164 352 196 L352 226 C352 245 362 256 382 256 C362 256 352 267 352 286 L352 316 C352 348 344 366 308 366" stroke="#e8f1ed" stroke-width="30"/>
      <path d="M212 262 L244 294 L302 222" stroke="url(#mint)" stroke-width="34"/>
    </g>
  </g>

  <!-- wordmark and claim -->
  <text class="mono" x="176" y="100" font-size="13" font-weight="600" letter-spacing="2.5" fill="#34d399">AGENT SKILL</text>
  <text class="mono" x="172" y="152" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#f0f6f3">clean<tspan fill="#34d399">-</tspan>code</text>
  <text class="sans" x="74" y="226" font-size="30" font-weight="500" fill="#b9c8c1">Clean Code after Robert C. Martin,</text>
  <text class="sans" x="74" y="266" font-size="30" font-weight="700" fill="#f0f6f3">rebuilt for coding agents.</text>

  <g class="mono" font-size="14">
    <rect x="74" y="300" width="188" height="32" rx="16" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="168" y="321" text-anchor="middle" fill="#a7f3d0">Agent Skills format</text>
    <rect x="274" y="300" width="268" height="32" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="408" y="321" text-anchor="middle" fill="#c9d6d0">Claude Code · Codex · Cursor</text>
    <rect x="554" y="300" width="60" height="32" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="584" y="321" text-anchor="middle" fill="#c9d6d0">MIT</text>
  </g>
  <text class="mono" x="74" y="370" font-size="13" fill="#5f706a">github.com/jonax1337/clean-code-skill</text>

  <!-- agent report -->
  <g transform="translate(760 64)">
    <rect width="448" height="272" rx="14" fill="#0f1a17" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle cx="24" cy="26" r="5" fill="#2a3833"/>
    <circle cx="42" cy="26" r="5" fill="#2a3833"/>
    <circle cx="60" cy="26" r="5" fill="#2a3833"/>
    <text class="mono" x="424" y="31" font-size="13" text-anchor="end" fill="#6f8079">agent report</text>
    <rect x="0" y="48" width="448" height="1" fill="#ffffff" fill-opacity="0.07"/>

    <g class="mono" font-size="15">
      <g transform="translate(0 86)">
        <path d="M26 -5 l4.5 4.5 l9 -10" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="56" y="0" font-weight="700" fill="#e6efeb">scope</text>
        <text x="130" y="0" fill="#9fb0a9">only what the task asked for</text>
      </g>
      <g transform="translate(0 124)">
        <path d="M26 -5 l4.5 4.5 l9 -10" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="56" y="0" font-weight="700" fill="#e6efeb">reuse</text>
        <text x="130" y="0" fill="#9fb0a9">existing helpers, no copies</text>
      </g>
      <g transform="translate(0 162)">
        <path d="M26 -5 l4.5 4.5 l9 -10" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="56" y="0" font-weight="700" fill="#e6efeb">tests</text>
        <text x="130" y="0" fill="#9fb0a9">new test fails on old code</text>
      </g>
      <g transform="translate(0 200)">
        <path d="M26 -5 l4.5 4.5 l9 -10" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="56" y="0" font-weight="700" fill="#e6efeb">verify</text>
        <text x="130" y="0" fill="#9fb0a9">ran after the last edit</text>
      </g>
      <g transform="translate(0 238)">
        <path d="M26 -5 l4.5 4.5 l9 -10" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="56" y="0" font-weight="700" fill="#e6efeb">report</text>
        <text x="130" y="0" fill="#9fb0a9">claims only what was checked</text>
      </g>
    </g>
  </g>
</svg>
